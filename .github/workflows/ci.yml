name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci-cd/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python for deployment client checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check deployment client security and upload protocol
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r scripts/remote-deploy-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Deployment client dependency installation failed.' }
          python -B -m unittest discover -s scripts/tests -p test_remote_deploy.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Deployment client checks failed.' }

      - name: Check restricted server deployment validators
        shell: powershell
        run: ./scripts/tests/Test-RemoteDeployment.ps1

      - name: Set up MSBuild for the classic .NET Framework web project
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Set up NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
        with:
          nuget-version: '6.14.0'

      - name: Restore, build, validate Razor views and publish
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'kafe-web'
          ./scripts/Build-Package.ps1 `
            -OutputDirectory $packageDirectory `
            -CommitSha $env:GITHUB_SHA

      - name: Store the validated web package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kafe-web-${{ github.sha }}
          path: ${{ runner.temp }}/kafe-web
          if-no-files-found: error
          retention-days: 7

      - name: Record the scope of verification
        if: always()
        shell: pwsh
        run: |
          @'
          ## Verification scope
          This workflow restores the existing packages.config dependencies, builds Release,
          validates Razor views, and checks the published web package.
          Deployment client security and protocol unit checks also run.

          No automated application tests are currently configured in this repository.
          No database, schema migration, seed, reset or A01-A16 acceptance tests are run.
          A successful workflow does not mean that the planned cafe features are complete.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
